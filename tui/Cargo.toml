[package]
name = "podarcis"
version = "11.10.0"
edition = "2021"
rust-version = "1.86"
description = "Podarcis engine: the podarcis-tui wiki frontend and the podarcis CLI, one library"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "podarcis"
path = "src/lib.rs"

[[bin]]
name = "podarcis-tui"
path = "src/main.rs"

[[bin]]
name = "podarcis"
path = "src/bin/podarcis.rs"

[dependencies]
anyhow = "1"
catppuccin = { version = "2.8", features = ["ratatui"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
csv = "1"
edtui = { version = "0.11", default-features = false, features = ["mouse-support"] }
gray_matter = "0.3"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
libc = "0.2"
notify = "8"
nucleo-matcher = "0.3"
portable-pty = "0.9"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = "0.30"
regex = "1.13.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tui-term = "0.3"
toml = "0.9"
unicode-width = "0.2"
vt100 = "0.16"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
