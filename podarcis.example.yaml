# Podarcis Local Configuration & Secrets
# Copy this file to `podarcis.yaml` (automatically done by `python -m tui.setup`).
# `podarcis.yaml` is excluded from git tracking to prevent leaking private information.

# API Credentials
apis:
  semantic_scholar_api_key: "your_api_key_here"

# Decoupled Workspace Repository URLs
repositories:
  wiki: "git@gitlab-internal.bsc.es:xmaripra/hpdsa-wiki-wiki.git"
  workspace: "git@gitlab-internal.bsc.es:xmaripra/hpdsa-wiki-workspace.git"

# Optional Tool Engines
engines:
  qmd: false  # Quick Markdown Vector DB search engine (requires Node.js & @tobilu/qmd)
