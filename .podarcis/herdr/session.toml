# Template copied to ~/.config/herdr/sessions/podarcis/config.toml
# on first `podarcis wiki` (or `--reset-config`). herdr writes into the live
# path; this file is never pointed at with HERDR_CONFIG_PATH.

onboarding = false

[keys]
prefix = "ctrl+space"

[ui]
sidebar_start_collapsed = false

[experimental]
allow_nested = false

[[keys.command]]
key = "prefix+/"
type = "popup"
command = "python3 -m podarcis.tui.actions.search_overlay"
description = "wiki search"
width = "80%"
height = 20

[[keys.command]]
key = "prefix+shift+l"
type = "popup"
command = "python3 -m podarcis.tui.actions.lint_overlay"
description = "wiki lint"
width = "80%"
height = 20

[[keys.command]]
key = "prefix+shift+s"
type = "popup"
command = "python3 -m podarcis.tui.actions.sync"
description = "wiki repo sync"

[[keys.command]]
key = "prefix+shift+c"
type = "popup"
command = "python3 -m podarcis.tui.actions.commit"
description = "lint-gated commit"
width = "80%"
height = 16
