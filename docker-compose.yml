version: '3.8'

networks:
  podarcis-net:
    driver: bridge

services:
  podarcis-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: podarcis-user:latest
    container_name: podarcis_multiuser_server
    networks:
      - podarcis-net
    environment:
      - SECRET_KEY=${SECRET_KEY:-podarcis-secret-key-multiuser-2026}
      - PORT=${PORT:-8080}
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/users:/app/data/users
    ports:
      - "${PORT:-8080}:8080"
    command: python3 -m podarcis.server.app
    restart: unless-stopped
