[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "podarcis"
version = "7.1.0"
description = "Podarcis Open Knowledge Format (OKF v0.2) research agent engine and CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0,<2.0.0",
    "rich",
    "questionary",
    "python-dotenv>=1.0.0",
    "pytest",
    "pyyaml>=6.0",
    "markitdown[pdf]>=0.1.7",
    "scipy>=1.15.3",
    "pandas>=2.0.0",
    "rapidfuzz>=3.0.0",
    # menumaker (podarcis menu): hard imports in food_db/optimizer, pricing, intake.
    "numpy>=1.24",
    "requests>=2.28",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
# Headless-browser fallback for publishers behind Cloudflare/bot walls (MDPI,
# Springer, ScienceDirect). Requires `playwright install chromium` after install.
browser = ["playwright>=1.40"]
# Live Mercadona scraping for `podarcis menu price`; it falls back to the
# bundled price history when these are absent.
menu-live = ["mercapy>=1.0", "requests_html>=0.10", "websockets>=13.0"]

[project.scripts]
podarcis = "podarcis.cli:main"
podarcis-mcp = "podarcis.gateway.server:main"

[tool.setuptools.package-dir]
podarcis = ".podarcis"

[tool.pytest.ini_options]
norecursedirs = [".git", ".venv", ".obsidian", "__pycache__", "node_modules"]
testpaths = [
    ".agents/mcp",
    ".agents/skills",
    ".podarcis/tests"
]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
pythonpath = [
    ".",
    ".podarcis",
    ".agents/mcp/wiki",
    ".agents/mcp/research",
    ".agents/mcp/diagnostics",
    ".agents/skills/self-improvement/scripts"
]
