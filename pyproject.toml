[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "podarcis"
version = "2.2.0"
description = "Podarcis Open Knowledge Format (OKF v0.2) research agent engine and CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0,<2.0.0",
    "rich",
    "questionary",
    "python-dotenv>=1.0.0",
    "pytest",
    "pyyaml>=6.0",
    "yfinance",
    "markitdown>=0.1.7",
    "scipy>=1.15.3",
]

[project.scripts]
podarcis = "podarcis.cli:main"
podarcis-mcp = "podarcis.gateway.server:main"

[tool.setuptools.package-dir]
podarcis = ".podarcis"

[tool.pytest.ini_options]
norecursedirs = [".git", ".venv", ".obsidian", "__pycache__", "node_modules"]
testpaths = [
    ".agents/mcp",
    ".agents/skills",
    ".podarcis/tests"
]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
pythonpath = [
    ".",
    ".podarcis",
    ".agents/mcp/wiki",
    ".agents/mcp/finance",
    ".agents/mcp/research",
    ".agents/mcp/diagnostics",
    ".agents/skills/harness/scripts",
    ".agents/skills/self-improvement/scripts"
]
