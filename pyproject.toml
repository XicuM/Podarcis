[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "podarcis"
version = "10.1.0"
description = "Podarcis Open Knowledge Format (OKF v0.2) research agent engine and CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0,<2.0.0",
    "rich",
    "questionary",
    "python-dotenv>=1.0.0",
    "pytest",
    "pyyaml>=6.0",
    "markitdown[pdf]>=0.1.7",
    "httpx",
]

[project.optional-dependencies]
# Headless-browser fallback for publishers behind Cloudflare/bot walls (MDPI,
# Springer, ScienceDirect). Requires `playwright install chromium` after install.
browser = ["playwright>=1.40"]

[project.scripts]
podarcis = "podarcis.cli:main"
podarcis-mcp = "podarcis.gateway.server:main"

[tool.setuptools.package-dir]
podarcis = ".podarcis"

[tool.pytest.ini_options]
norecursedirs = [".git", ".venv", ".obsidian", "__pycache__", "node_modules"]
testpaths = [
    ".agents/mcp",
    ".apm/skills",
    ".podarcis/tests"
]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
# The engine is imported as `podarcis.*` via the editable install and needs no
# entry here. Only the standalone MCP servers and skill scripts — which are
# loaded by file path, not as package modules — do.
pythonpath = [
    ".agents/mcp/wiki",
    ".agents/mcp/research",
    ".agents/mcp/diagnostics",
    ".apm/skills/self-improvement/scripts"
]
